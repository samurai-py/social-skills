<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<link href="{{googleFonts}}" rel="stylesheet">
<style>
  {{baseStyles}}
  /* NEUTRAL SKELETON — 1080x1920 story. Full-bleed photo slot (data.bgimage) with the
     legibility overlay, content in the bottom third. No decoration of its own; see
     post-square.html for the skeleton rules. Code-only. */
  #canvas{width:1080px;height:1920px;position:relative;isolation:isolate;overflow:hidden;background:{{bg}};color:{{text}};font-family:{{display}};padding:76px;display:flex;flex-direction:column;justify-content:space-between;}
  .lockup{position:relative;z-index:1;display:flex;align-items:center;gap:14px;}
  .lockup .ic{width:38px;height:38px;color:{{text}};}
  .lockup .ic:empty{display:none;}
  .lockup span{font-family:{{mono}};font-size:24px;letter-spacing:1px;color:{{text}};}
  .bottom{position:relative;z-index:1;}
  .kicker{font-family:{{mono}};font-size:26px;color:{{accent}};text-transform:uppercase;letter-spacing:3px;padding-bottom:24px;}
  .kicker:empty{display:none;}
  .title{font-weight:700;font-size:104px;line-height:1.05;letter-spacing:-2.5px;color:{{text}};}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:36px;}
  .cta{font-family:{{mono}};font-size:28px;color:{{accent}};}
  .handle{font-family:{{mono}};font-size:26px;color:{{muted}};}
</style></head>
<body>
  <div id="canvas">
    <div class="bg-photo" style="{{bgstyle}}background-color:{{surface}};"></div>
    <div class="bg-overlay"></div>
    <div class="bg-pattern {{patternClass}}"></div>
    <div class="lockup"><span class="ic">{{logoSvg}}</span><span>{{logoText}}</span></div>
    <div class="bottom">
      <div class="kicker">{{kicker}}</div>
      <div class="title">{{titulo}}</div>
      <div class="foot"><span class="cta">{{cta}}</span><span class="handle">{{handle}}</span></div>
    </div>
  </div>
</body></html>
