<!doctype html>
<!--
  TEMPLATE SKELETON — copy to templates/<id>.html (framework, generic) or
  user/canva-killer/templates/<brandId>/<id>.html (exclusive to one brand) and edit.
  Rules:
  - {{baseStyles}} injects reset + background layers + patterns + helpers (.hl, .ic). Always include it.
  - Exactly ONE #canvas element at the target size (defines what gets exported), with
    position:relative + isolation:isolate + overflow:hidden (so the background layers work).
    Sizes: 1080x1080 (post), 1080x1920 (story), 1080x1350 (carousel), 1200x630 (cover/OG).
  - The 3 background divs (order matters): .bg-photo -> .bg-overlay -> .bg-pattern {{patternClass}}.
  - Brand tokens: {{bg}} {{surface}} {{text}} {{muted}} {{accent}} {{accent2}} {{gradient}}
                  {{display}} {{mono}} and any fonts.* key as {{font:key}} (e.g. {{font:body}}, {{font:cta}})
                  {{googleFonts}} {{logoText}} {{logoSvg}} {{handle}} {{name}}
                  (+ any top-level scalar of the brand JSON, e.g. {{tagline}})
    Content tokens (from `data`): {{titulo}} {{kicker}} {{cta}} {{topright}}... (create the ones you need)
  - Text accepts inline HTML: use <span class="hl">word</span> (base.css helper) to highlight.
  - Icons: {{icon:shield}} (Lucide) or {{icon:custom/name}} (assets/custom). Size the container.
  - Images: full-bleed photo = data.bgimage (local path/URL) on .bg-photo. Per-post image slot =
    background-image:url('{{img:hero}}') filled by data.hero (any slot name works). Make a slot
    OPTIONAL with {{has:hero}}: <div id="canvas" data-hero="{{has:hero}}"> + CSS
    #canvas[data-hero=""] .hero{display:none} — the layout collapses when the post has no image.
  - Background pattern: data.pattern (none|grid|dots|scanlines|mesh|hatch|noise); default none.
  - Brand font files in user/canva-killer/fonts/<brandId>/ are injected automatically via {{baseStyles}}.
  - Palette variant: data.variant = a key of the brand's `variants` (e.g. "light").
  - Files starting with "_" are ignored by list_templates.
-->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<link href="{{googleFonts}}" rel="stylesheet">
<style>
  {{baseStyles}}

  #canvas {
    width: 1080px; height: 1080px;    /* <- set to your layout size */
    position: relative; isolation: isolate; overflow: hidden;
    background: {{bg}}; color: {{text}}; font-family: {{display}};
    padding: 96px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .kicker { position: relative; z-index: 1; font-family: {{mono}}; color: {{accent}};
    text-transform: uppercase; letter-spacing: 4px; }
  .title  { position: relative; z-index: 1; font-weight: 700; font-size: 100px; line-height: 1.02; }
  .foot   { position: relative; z-index: 1; font-family: {{mono}}; color: {{muted}};
    display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div id="canvas">
    <div class="bg-photo" style="{{bgstyle}}"></div>
    <div class="bg-overlay"></div>
    <div class="bg-pattern {{patternClass}}"></div>
    <div class="kicker">{{kicker}}</div>
    <div class="title">{{titulo}}</div>
    <div class="foot"><span>{{cta}}</span><span>{{handle}}</span></div>
  </div>
</body>
</html>
